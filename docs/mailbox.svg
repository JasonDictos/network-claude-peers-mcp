<svg xmlns="http://www.w3.org/2000/svg" width="750" height="249" viewBox="0 0 750 249" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
  <rect width="750" height="249" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="750" height="30" rx="10" fill="#161b22"/><rect y="20" width="750" height="10" fill="#161b22"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/>
  <text x="375" y="19" fill="#8b949e" text-anchor="middle" font-size="11">durable mailboxes — message a session that isn't running</text>
  <text xml:space="preserve">
    <tspan x="16" y="44" fill="#7ee787">❯ </tspan><tspan x="31.6" y="44" fill="#c9d1d9">tell the claude in ~/etl that the backfill finished</tspan>
    
    <tspan x="16" y="86" fill="#e3b341">● </tspan><tspan x="31.6" y="86" fill="#c9d1d9">No live session for "~/etl" — queued for </tspan><tspan x="351.40000000000003" y="86" fill="#d2a8ff">etl-dudette</tspan>
    <tspan x="16" y="107" fill="#8b949e">  (delivered when it returns; held 7 days)</tspan>
    
    <tspan x="16" y="149" fill="#8b949e">  … 40 minutes later, on the other machine …</tspan>
    
    <tspan x="16" y="191" fill="#7ee787">archiver:~/etl $ </tspan><tspan x="148.6" y="191" fill="#c9d1d9">claude</tspan>
    <tspan x="16" y="212" fill="#8b949e">← claude-peers: </tspan><tspan x="140.8" y="212" fill="#d2a8ff">api-dude@jason-desktop</tspan><tspan x="312.4" y="212" fill="#c9d1d9">: the backfill finished</tspan>
  </text>
</svg>