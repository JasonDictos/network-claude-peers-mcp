    <tspan x="16" y="149" fill="#8b949e">← claude-peers: </tspan><tspan x="140.8" y="149" fill="#d2a8ff">eager-eddy</tspan><tspan x="218.8" y="149" fill="#c9d1d9">: Got it. Regenerating the typed client and</tspan>
